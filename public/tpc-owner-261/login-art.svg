<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17140f"/><stop offset=".55" stop-color="#0b0b0c"/><stop offset="1" stop-color="#070707"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff9933" stop-opacity=".55"/><stop offset="1" stop-color="#ff9933" stop-opacity="0"/></radialGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a5a5e"/><stop offset="1" stop-color="#1c1c1f"/></linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a8a90"/><stop offset="1" stop-color="#2a2a2e"/></linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb74d"/><stop offset="1" stop-color="#e8741a"/></linearGradient>
    <linearGradient id="streak" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".6" stop-color="#ffd9a8" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="streak2" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8b7cf6" stop-opacity="0"/><stop offset=".7" stop-color="#b19dff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <ellipse cx="400" cy="260" rx="330" ry="260" fill="url(#glow)"/>
  <!-- light streaks -->
  <g transform="rotate(-38 400 400)">
    <rect x="120" y="150" width="900" height="26" fill="url(#streak)" opacity=".75"/>
    <rect x="60" y="205" width="900" height="8" fill="url(#streak2)"/>
    <rect x="180" y="104" width="760" height="5" fill="url(#streak)" opacity=".6"/>
  </g>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="90" cy="120" r="1.6" opacity=".7"/><circle cx="700" cy="90" r="1.3" opacity=".6"/><circle cx="640" cy="300" r="1.8" opacity=".8"/>
    <circle cx="140" cy="360" r="1.2" opacity=".5"/><circle cx="740" cy="440" r="1.4" opacity=".6"/><circle cx="60" cy="520" r="1.6" opacity=".6"/>
    <circle cx="330" cy="70" r="1.1" opacity=".5"/><circle cx="520" cy="150" r="1.5" opacity=".7"/>
  </g>
  <!-- book shadow -->
  <ellipse cx="400" cy="486" rx="210" ry="34" fill="#000" opacity=".7" filter="url(#blur)"/>
  <!-- open book, faceted -->
  <g transform="translate(400 318) scale(.8)">
    <!-- back cover -->
    <polygon points="-250,120 0,175 250,120 250,150 0,205 -250,150" fill="#1a1a1d"/>
    <!-- left pages stack -->
    <polygon points="-240,-10 0,50 0,170 -240,112" fill="url(#pageL)"/>
    <polygon points="-240,-10 -20,-95 0,-40 0,50" fill="#3a3a3f"/>
    <polygon points="-240,-10 -20,-95 -20,-80 -230,0" fill="#6e6e74" opacity=".6"/>
    <!-- right pages stack -->
    <polygon points="240,-10 0,50 0,170 240,112" fill="url(#pageR)"/>
    <polygon points="240,-10 20,-95 0,-40 0,50" fill="#58585e"/>
    <polygon points="240,-10 20,-95 20,-80 230,0" fill="#b4b4ba" opacity=".5"/>
    <!-- spine glow -->
    <polygon points="-6,-40 6,-40 6,170 -6,170" fill="url(#spine)"/>
    <!-- text lines left -->
    <g stroke="#c9c9cf" stroke-opacity=".35" stroke-width="3" stroke-linecap="round">
      <line x1="-200" y1="22" x2="-40" y2="64"/><line x1="-200" y1="46" x2="-40" y2="88"/><line x1="-200" y1="70" x2="-40" y2="112"/><line x1="-200" y1="94" x2="-70" y2="128"/>
    </g>
    <g stroke="#e8e8ec" stroke-opacity=".4" stroke-width="3" stroke-linecap="round">
      <line x1="200" y1="22" x2="40" y2="64"/><line x1="200" y1="46" x2="40" y2="88"/><line x1="200" y1="70" x2="40" y2="112"/><line x1="200" y1="94" x2="70" y2="128"/>
    </g>
    <!-- floating pages -->
    <g>
      <polygon points="-150,-130 -70,-170 -40,-110 -120,-70" fill="#ececf0" opacity=".9"/>
      <polygon points="-150,-130 -70,-170 -66,-160 -144,-122" fill="#fff"/>
      <polygon points="80,-190 170,-150 140,-92 52,-130" fill="#d9d9de" opacity=".85"/>
      <polygon points="190,-80 250,-52 232,-8 172,-36" fill="#bdbdc4" opacity=".7"/>
      <polygon points="-230,-70 -176,-48 -190,-6 -244,-28" fill="#a6a6ad" opacity=".6"/>
    </g>
    <!-- feather / spark of light rising from the spine -->
    <polygon points="0,-40 10,-150 0,-250 -10,-150" fill="#ffb74d" opacity=".9" filter="url(#soft)"/>
    <ellipse cx="0" cy="-262" rx="9" ry="9" fill="#fff"/>
    <ellipse cx="0" cy="-262" rx="38" ry="38" fill="#ff9933" opacity=".35" filter="url(#blur)"/>
  </g>
  <!-- base fade so the bottom card sits on flat dark -->
  <rect y="660" width="800" height="340" fill="#080808"/>
  <rect y="600" width="800" height="60" fill="url(#bg)" opacity=".0"/>
</svg>
